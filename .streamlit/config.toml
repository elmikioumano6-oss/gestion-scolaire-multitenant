[theme]
primaryColor = "#B7791F"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#E8EEF5"
textColor = "#172033"
font = "sans-serif"
baseRadius = "0.75rem"
showWidgetBorder = true

[server]
headless = false
enableXsrProtection = true
enableCORS = true
maxUploadSize = 20

[browser]
gatherUsageStats = false